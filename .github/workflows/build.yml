
name: Build HavaMitra Marathi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          flutter create --project-name hava_mitra_marathi --platforms=android /tmp/hava_mitra_marathi
          cp -R /tmp/hava_mitra_marathi/android ./android

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HavaMitra-Marathi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
